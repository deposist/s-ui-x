name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.5.10-beta4"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release-ref:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.checkout.outputs.tag }}
      commit: ${{ steps.checkout.outputs.commit }}
      prerelease: ${{ steps.checkout.outputs.prerelease }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Validate and check out exact release tag
        id: checkout
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          event_commit: ${{ github.event_name == 'push' && github.sha || '' }}

  build:
    needs: release-ref
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tags
        id: vars
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.release-ref.outputs.tag }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            echo "$IMAGE_NAME:$TAG"
            if [[ "$PRERELEASE" != true ]]; then
              echo "$IMAGE_NAME:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
