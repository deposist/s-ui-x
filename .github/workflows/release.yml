name: Release S-UI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.5.12-beta1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "25"
  CRONET_GO_VERSION: "2faf34666c2cc8234f10f2ab6d4c4d6104d34ae2"
  CRONET_GO_REPO: https://github.com/sagernet/cronet-go.git
  BOOTLIN_BASE_URL: https://toolchains.bootlin.com/downloads/releases/toolchains

jobs:
  release-ref:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.checkout.outputs.tag }}
      commit: ${{ steps.checkout.outputs.commit }}
      version: ${{ steps.checkout.outputs.version }}
      prerelease: ${{ steps.checkout.outputs.prerelease }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Validate and check out exact release tag
        id: checkout
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          event_commit: ${{ github.event_name == 'push' && github.sha || '' }}

  build-frontend:
    needs: release-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
          event_commit: ${{ github.event_name == 'push' && github.sha || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Strict, fail-closed install: a desynced package-lock.json aborts the
      # release here instead of silently shipping an unvalidated bundle.
      # `npm install` (lenient) previously masked a lockfile desync and shipped
      # an inconsistent dist with a dangling chunk -> 404 -> black screen
      # (v1.5.7-beta6). Mirror the same gates CI runs so a release can never
      # carry a frontend that CI would reject.
      - name: Install frontend dependencies (strict)
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify production frontend dist
        working-directory: frontend
        run: npm run verify:dist
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build-windows:
    needs: release-ref
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ needs.release-ref.outputs.tag }}
      expected_commit: ${{ needs.release-ref.outputs.commit }}

  build-linux:
    name: Build-${{ matrix.platform }}
    needs: [release-ref, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: amd64, arch: amd64, bootlin: x86-64, naive: true }
          - { platform: arm64, arch: arm64, bootlin: aarch64, naive: true }
          - { platform: armv7, arch: arm, goarm: "7", bootlin: armv7-eabihf, naive: true }
          - { platform: armv6, arch: arm, goarm: "6", bootlin: armv6-eabihf, naive: true }
          - { platform: armv5, arch: arm, goarm: "5", bootlin: armv5-eabi, naive: false }
          - { platform: "386", arch: "386", bootlin: x86-i686, naive: true }
          - { platform: s390x, arch: s390x, bootlin: s390x-z13, naive: false }
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
          event_commit: ${{ github.event_name == 'push' && github.sha || '' }}

      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: web/html

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Clone cronet-go (naive platforms)
        if: matrix.naive
        run: |
          set -e
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin ${{ env.CRONET_GO_REPO }}
          git -C ~/cronet-go fetch --depth=1 origin "${{ env.CRONET_GO_VERSION }}"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring (cronet sysroot)
        if: matrix.naive
        run: |
          set -e
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Build cronet library and set toolchain environment
        if: matrix.naive
        run: |
          set -e
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env | while IFS= read -r line; do
            line="${line#export }"
            [[ -z "$line" ]] && continue
            echo "$line" >> $GITHUB_ENV
          done

      - name: Set Go build environment
        run: |
          echo "CGO_ENABLED=1" >> $GITHUB_ENV
          echo "GOOS=linux" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          if [ -n "${{ matrix.goarm }}" ]; then echo "GOARM=${{ matrix.goarm }}" >> $GITHUB_ENV; fi

      - name: Set up Bootlin musl (non-naive platforms)
        if: ${{ matrix.naive != true }}
        run: |
          set -e
          BOOTLIN_ARCH="${{ matrix.bootlin }}"
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="${{ env.BOOTLIN_BASE_URL }}/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Bootlin musl toolchain not found for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          TOOLCHAIN_DIR="$(realpath "$TOOLCHAIN_DIR")"
          BIN_DIR="$TOOLCHAIN_DIR/bin"
          echo "PATH=$BIN_DIR:$PATH" >> $GITHUB_ENV
          CC=$(find "$BIN_DIR" -maxdepth 1 \( -name '*-gcc.br_real' -o -name '*-gcc' \) -type f -executable 2>/dev/null | grep -v g++ | head -n1)
          [ -z "$CC" ] && { echo "gcc not found in $BIN_DIR" >&2; exit 1; }
          echo "CC=$(realpath "$CC")" >> $GITHUB_ENV
          SYSROOT=""
          F=$(find "$TOOLCHAIN_DIR" -name "libc-header-start.h" 2>/dev/null | head -1)
          if [ -n "$F" ]; then SYSROOT=$(dirname "$(dirname "$(dirname "$(dirname "$F")")")"); fi
          if [ -n "$SYSROOT" ] && [ -d "$SYSROOT" ]; then
            echo "CGO_CFLAGS=--sysroot=$SYSROOT" >> $GITHUB_ENV
            echo "CGO_LDFLAGS=--sysroot=$SYSROOT -static" >> $GITHUB_ENV
          fi

      - name: Build s-ui
        run: |
          set -e
          BUILD_TAGS="with_quic,with_grpc,with_utls,with_acme,with_gvisor,badlinkname,tfogo_checklinkname0,with_tailscale"
          [ "${{ matrix.naive }}" = "true" ] && BUILD_TAGS="${BUILD_TAGS},with_naive_outbound,with_musl"
          go build -ldflags="-w -s -checklinkname=0 -linkmode external -extldflags '-static' -X github.com/deposist/s-ui-x/config.ArtifactPlatform=${{ matrix.platform }}" -tags "$BUILD_TAGS" -o sui main.go
          file sui
          ldd sui 2>/dev/null || echo "Static binary confirmed"

          mkdir s-ui
          cp sui s-ui/
          cp s-ui.service s-ui/
          cp s-ui.sh s-ui/

          tar -czf "s-ui-linux-${{ matrix.platform }}.tar.gz" s-ui
      - name: Generate SHA256 checksum
        shell: bash
        run: sha256sum --binary s-ui-linux-${{ matrix.platform }}.tar.gz > s-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: s-ui-linux-${{ matrix.platform }}
          path: |
            ./s-ui-linux-${{ matrix.platform }}.tar.gz
            ./s-ui-linux-${{ matrix.platform }}.tar.gz.sha256
          retention-days: 1

  publish-release:
    name: Reconcile and publish verified release
    needs: [release-ref, build-linux, build-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
      - name: Download Linux build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: s-ui-linux-*
          path: release-assets
          merge-multiple: true
      - name: Download Windows build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: s-ui-windows-*
          path: release-assets
          merge-multiple: true
      - name: Verify local release checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum --check --strict s-ui-linux-*.sha256 s-ui-windows-*.sha256
      - name: Ensure draft release exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
          COMMIT: ${{ needs.release-ref.outputs.commit }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_PATH="$RUNNER_TEMP/empty-release-notes.md"
          if [[ -f ".github/RELEASE_NOTES_${TAG}.md" ]]; then
            NOTES_PATH=".github/RELEASE_NOTES_${TAG}.md"
          else
            : > "$NOTES_PATH"
          fi
          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,name,body >/tmp/release.json 2>/dev/null; then
            jq -e --arg tag "$TAG" --arg commit "$COMMIT" --arg prerelease "$PRERELEASE" --arg notes "$(cat "$NOTES_PATH")" '
              .tagName == $tag and
              .targetCommitish == $commit and
              .isDraft == true and
              (.isPrerelease | tostring) == $prerelease and
              (.name == ("s-ui " + $tag)) and
              .body == $notes
            ' /tmp/release.json >/dev/null
          else
            args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$COMMIT" --title "s-ui $TAG" --notes-file "$NOTES_PATH" --draft --latest=false)
            [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi
      - name: Reconcile release assets by authoritative digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
        run: bash scripts/check-release-assets.sh "$GITHUB_REPOSITORY" "$TAG" release-assets
      - name: Verify exact remote release assets and digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
        run: bash scripts/check-release-assets.sh --verify "$GITHUB_REPOSITORY" "$TAG" release-assets
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
          NOTES_PATH: ${{ steps.release.outputs.notes_path }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "s-ui $TAG" --notes-file "$NOTES_PATH" --draft=false)
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--prerelease=false --latest)
          fi
          gh "${args[@]}"
      - name: Verify published release inventory and classification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-ref.outputs.tag }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease >/tmp/published-release.json
          jq -e --arg tag "$TAG" --arg commit "${{ needs.release-ref.outputs.commit }}" --arg prerelease "$PRERELEASE" '
            .tagName == $tag and
            .targetCommitish == $commit and
            .isDraft == false and
            (.isPrerelease | tostring) == $prerelease
          ' /tmp/published-release.json >/dev/null
