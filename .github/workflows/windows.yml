name: Build S-UI for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.5.10-beta4"
        type: string
  workflow_call:
    inputs:
      tag:
        description: Validated release tag from the caller
        required: true
        type: string
      expected_commit:
        description: Commit already resolved by the caller
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NODE_VERSION: "25"
  TAGS: "with_quic,with_grpc,with_utls,with_acme,with_gvisor,with_naive_outbound,with_purego,badlinkname,tfogo_checklinkname0,with_tailscale,with_wireguard"
  # Pinned cronet-go release tag (not releases/latest). GitHub currently marks
  # this release mutable, so the per-architecture SHA-256 checks below are the
  # fail-closed integrity boundary for the downloaded DLL.
  LIBCRONET_BASE_URL: "https://github.com/SagerNet/cronet-go/releases/download/v148.0.7778.96-1"

jobs:
  release-ref:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.checkout.outputs.tag }}
      commit: ${{ steps.checkout.outputs.commit }}
      version: ${{ steps.checkout.outputs.version }}
      prerelease: ${{ steps.checkout.outputs.prerelease }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Validate and check out exact release tag
        id: checkout
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          expected_commit: ${{ inputs.expected_commit || '' }}
          event_commit: ${{ github.event_name == 'push' && github.sha || '' }}

  build-frontend:
    needs: release-ref
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (strict)
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Frontend unit tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify production frontend dist
        working-directory: frontend
        run: npm run verify:dist

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-windows:
    needs: [release-ref, build-frontend]
    name: Build-windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: windows-latest, cgo: "1" }
          - { arch: arm64, runner: ubuntu-latest, cgo: "0" }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Check out exact release tag
        uses: ./.github/actions/checkout-release-tag
        with:
          tag: ${{ needs.release-ref.outputs.tag }}
          expected_commit: ${{ needs.release-ref.outputs.commit }}
      - name: Download frontend build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: web/html
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Install zip for Windows
        if: matrix.arch == 'amd64'
        shell: powershell
        run: |
          if (!(Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          choco install zip -y

      - name: Build s-ui
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=${{ matrix.cgo }}
          export GOOS=windows
          export GOARCH=${{ matrix.arch }}

          echo "Building for Windows ${{ matrix.arch }}"
          go version
          go env GOOS GOARCH

          go build -ldflags="-w -s -X github.com/deposist/s-ui-x/config.ArtifactPlatform=${{ matrix.arch }} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -checklinkname=0" -tags "${{ env.TAGS }}" -o sui.exe main.go
          file sui.exe

          mkdir s-ui-windows
          cp sui.exe s-ui-windows/
          cp -r windows/* s-ui-windows/

      - name: Download libcronet-go
        shell: bash
        run: |
          # Pinned release tag (env.LIBCRONET_BASE_URL) + sha256 verification.
          # Asset digests captured from the GitHub release API; update the tag and
          # hashes together. Fail closed on download error or hash mismatch.
          case "${{ matrix.arch }}" in
            amd64) CRONET_SHA256="c7434cfa93c3041321dd19111c4de6c52b8a9531a65661ba45425d3c51ec69e2" ;;
            arm64) CRONET_SHA256="fc9e3bae0b326d83092a5de2c04d8b4139dc5c1ba576a035dee4bde780a3c95f" ;;
            *) echo "no pinned libcronet sha256 for arch ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          curl --fail --location --silent --show-error -o s-ui-windows/libcronet.dll "${{ env.LIBCRONET_BASE_URL }}/libcronet-windows-${{ matrix.arch }}.dll"
          printf '%s  *s-ui-windows/libcronet.dll\n' "$CRONET_SHA256" | sha256sum --check -

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          zip -r "s-ui-windows-${{ matrix.arch }}.zip" s-ui-windows
          sha256sum --binary "s-ui-windows-${{ matrix.arch }}.zip" > "s-ui-windows-${{ matrix.arch }}.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: s-ui-windows-${{ matrix.arch }}
          path: |
            ./s-ui-windows-${{ matrix.arch }}.zip
            ./s-ui-windows-${{ matrix.arch }}.zip.sha256
          retention-days: 1
