name: Audit Perf

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: audit-perf-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  BENCHSTAT_VERSION: "v0.0.0-20260709024250-82a0b07e230d"

jobs:
  bench-all:
    name: bench-all
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || contains(join(github.event.pull_request.labels.*.name, ','), 'run-perf') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "25"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify production frontend dist
        working-directory: frontend
        run: npm run verify:dist
      - name: Install frontend assets for Go embed packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web/html
          mkdir -p web/html
          cp -a frontend/dist/. web/html/
      - name: Install benchstat
        run: |
          set -euo pipefail
          go install "golang.org/x/perf/cmd/benchstat@${BENCHSTAT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Benchmark base revision on the same runner
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE_SHA="$PR_BASE_SHA"
          if [ -z "$BASE_SHA" ] && [ -n "$PUSH_BASE_SHA" ] && [ "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git worktree add ../audit-perf-base "$BASE_SHA"
          trap 'git worktree remove --force ../audit-perf-base' EXIT
          npm ci --prefix ../audit-perf-base/frontend
          npm run build --prefix ../audit-perf-base/frontend
          rm -rf ../audit-perf-base/web/html
          mkdir -p ../audit-perf-base/web/html
          cp -a ../audit-perf-base/frontend/dist/. ../audit-perf-base/web/html/
          mkdir -p tests/baseline/phase5
          (
            cd ../audit-perf-base
            go test -run='^$' -bench=. -benchmem -benchtime=1s ./core ./sub ./paidsub ./service ./util ./util/common
          ) > tests/baseline/phase5/bench-all.txt
          grep -q '^Benchmark' tests/baseline/phase5/bench-all.txt
      - name: Run benchmarks
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/baseline/run-command.ps1 -Phase phase8 -Name bench-all -CommandLine "go test -run=^$ -bench=. -benchmem -benchtime=1s ./core ./sub ./paidsub ./service ./util ./util/common"
      - name: Require benchmark results and baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Benchmark' tests/baseline/phase8/bench-all.txt
          test -s tests/baseline/phase5/bench-all.txt
      - name: Compare with same-run baseline
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/baseline/run-command.ps1 -Phase phase8 -Name benchstat -CommandLine "benchstat tests/baseline/phase5/bench-all.txt tests/baseline/phase8/bench-all.txt"
      - name: Detect >20 percent ns/op regressions
        id: regression
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const parse = (file) => {
            const rows = new Map();
            for (const line of fs.readFileSync(file, 'utf8').split(/\r?\n/)) {
              const m = line.match(/^(Benchmark\S+)\s+\d+\s+([\d.]+)\s+ns\/op/);
              if (m) rows.set(m[1], Number(m[2]));
            }
            return rows;
          };
          const oldRows = parse('tests/baseline/phase5/bench-all.txt');
          const newRows = parse('tests/baseline/phase8/bench-all.txt');
          const regressions = [];
          for (const [name, oldNs] of oldRows) {
            const newNs = newRows.get(name);
            if (newNs !== undefined && oldNs > 0 && newNs > oldNs * 1.2) {
              regressions.push({ name, oldNs, newNs, ratio: newNs / oldNs });
            }
          }
          fs.writeFileSync('tests/baseline/phase8/perf-regressions.json', JSON.stringify(regressions, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `regression=${regressions.length > 0}\n`);
          for (const row of regressions.slice(0, 20)) {
            console.log(`::warning title=Perf regression::${row.name} ${row.oldNs} -> ${row.newNs} ns/op (${row.ratio.toFixed(2)}x)`);
          }
          NODE
      - name: Comment perf warning on PR
        if: ${{ github.event_name == 'pull_request' && steps.regression.outputs.regression == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const rows = JSON.parse(fs.readFileSync('tests/baseline/phase8/perf-regressions.json', 'utf8'));
            const body = [
              'Phase 8 perf warning: benchmark regressions above 20% were detected.',
              '',
              ...rows.slice(0, 20).map((row) => `- \`${row.name}\`: ${row.oldNs} -> ${row.newNs} ns/op (${row.ratio.toFixed(2)}x)`),
              '',
              'Inspect benchstat.txt before deciding whether it is noise or a real regression.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: audit-perf-bench
          path: |
            tests/baseline/phase8/bench-all.txt
            tests/baseline/phase8/bench-all.junit.xml
            tests/baseline/phase8/benchstat.txt
            tests/baseline/phase8/benchstat.junit.xml
            tests/baseline/phase8/perf-regressions.json
          if-no-files-found: error
          retention-days: 30
